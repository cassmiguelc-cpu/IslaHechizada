name: Listing watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save seen.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python cass_watch.py
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
      - name: Save state
        run: |
          git config user.name "listing-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git push

